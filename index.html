<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprouty Town</title>
<!-- Bridge page, published as https://salvamdz.github.io/partidas/ (repo SalvaMdz/partidas).
     It runs on the old address, where each phone keeps its save, and sends it to sproutytown.com. -->
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#5cb85c;color:#fff;font:800 22px system-ui,sans-serif;text-align:center}</style>
</head>
<body>
<div>🌱<br>Cargando tu partida…<br><a href="https://sproutytown.com/" style="color:#fff;font-size:16px">Ir a Sprouty Town</a></div>
<script>
(async () => {
  const OK = ['https://sproutytown.com/', 'http://localhost:8765/?traslado=1'];
  const asked = new URLSearchParams(location.search).get('a');
  const to = OK.includes(asked) ? asked : OK[0];
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('huerto-')) data[k] = localStorage.getItem(k); } } catch (e) {}
  if (!data['huerto-sonia-v4'] && !data['huerto-sonia-v3'] && !data['huerto-tito-3d-v2']) { location.replace(to + '#partida=no'); return; }
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  let out = bytes, tag = 'j.';
  if (window.CompressionStream) { out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); tag = ''; }
  let s = ''; for (let i = 0; i < out.length; i += 0x8000) s += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
  location.replace(to + '#partida=' + tag + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''));
})().catch(() => location.replace('https://sproutytown.com/#partida=no'));
</script>
</body>
</html>
